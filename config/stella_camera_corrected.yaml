# Flux supposé déjà rectifié.
# REMPLACE fx, fy, cx, cy avec les paramètres de l'image rectifiée publiée.
Camera:
  name: "rover front corrected"
  setup: "monocular"
  model: "perspective"

  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 240.0

  # Image déjà rectifiée : aucune distorsion résiduelle.
  k1: 0.0
  k2: 0.0
  p1: 0.0
  p2: 0.0
  k3: 0.0

  fps: 20.0
  cols: 640
  rows: 480
  color_order: "BGR"

Preprocessing:
  min_size: 400

Feature:
  name: "rover ORB"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Mapping:
  backend: "g2o"
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.9
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 20
  erase_temporal_keyframes: false
  num_temporal_keyframes: 15

Tracking:
  backend: "g2o"
  enable_temporal_keyframe_only_tracking: false

KeyframeInserter:
  wait_for_local_bundle_adjustment: false

Relocalizer:
  search_neighbor: true

LoopDetector:
  backend: "g2o"

System:
  map_format: "msgpack"
  num_grid_cols: 40
  num_grid_rows: 30
